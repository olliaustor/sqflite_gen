  recase: ^4.1.0
  sqlparser: ^0.45.0
  universal_io: ^2.3.1
  yaml: ^3.1.3

dev_dependencies:
  build_runner: ">=2.4.0 <2.15.2"
  json_serializable: ^6.14.0
  lints: ^6.1.0
  mocktail: ^1.0.5
  remove_from_coverage: ^2.0.0
  test: ^1.31.2
  very_good_analysis: ^10.3.0
